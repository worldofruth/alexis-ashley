<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alexis & Ashley — 5 Juin 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@200;300;400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--rose:#c5748a;--rose-light:#e8b4c2;--rose-pale:#f9eff2;--gold:#b8966e;--dark:#2a1f23;--cream:#fdf8f5}
html,body{height:100%;overflow:hidden;background:var(--cream);font-family:'Jost',sans-serif;font-weight:300;color:var(--dark)}
.page{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .7s ease,transform .7s ease}
.page.hidden{opacity:0;pointer-events:none;transform:translateY(20px)}
#page1{cursor:pointer;overflow:hidden;justify-content:flex-end;padding-bottom:64px}
.cover{position:absolute;inset:0}
.cover__img{width:100%;height:100%;object-fit:cover;object-position:center top}
.cover__overlay{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(42,31,35,.15) 0%,rgba(42,31,35,.45) 45%,rgba(42,31,35,.80) 72%,rgba(42,31,35,.92) 100%)}
.cover__content{position:relative;z-index:2;text-align:center;color:white;padding:0 24px}
.cover__bienvenue{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(2.2rem,9vw,4rem);color:var(--rose-light);display:block;margin-bottom:8px;text-shadow:0 2px 20px rgba(0,0,0,.6)}
.cover__sub{font-size:11px;letter-spacing:.4em;text-transform:uppercase;color:rgba(255,255,255,.7);margin-bottom:12px}
.cover__names{font-family:'Cormorant Garamond',serif;font-size:clamp(2rem,8vw,3.5rem);font-weight:600;letter-spacing:.05em;line-height:1;margin-bottom:8px;text-shadow:0 2px 16px rgba(0,0,0,.5)}
.cover__amp{font-style:italic;font-weight:300;color:var(--rose-light)}
.cover__date{font-size:10px;letter-spacing:.35em;text-transform:uppercase;color:rgba(255,255,255,.6);margin-bottom:36px}
.cover__cta{display:inline-flex;flex-direction:column;align-items:center;gap:8px;color:rgba(255,255,255,.85);font-size:10px;letter-spacing:.3em;text-transform:uppercase;animation:pulse 2.5s ease-in-out infinite}
.cover__cta svg{width:20px;height:20px;opacity:.7}
#page2{overflow-y:auto;padding:0}
.search-layout{display:flex;min-height:100vh;width:100%}
.search-photo{flex:0 0 42%;position:relative;overflow:hidden}
.search-photo__img{width:100%;height:100%;object-fit:cover;object-position:center top}
.search-photo__overlay{position:absolute;inset:0;background:linear-gradient(to right,transparent 60%,var(--cream) 100%)}
.search-content{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 40px}
.search-header{text-align:center;margin-bottom:36px}
.search-header__bienvenue{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(1.8rem,4vw,2.8rem);color:var(--rose);display:block;line-height:1;margin-bottom:6px}
.search-header__sub{font-size:10px;letter-spacing:.35em;text-transform:uppercase;color:var(--gold);margin-bottom:10px}
.search-header__names{font-family:'Cormorant Garamond',serif;font-size:clamp(1.5rem,3.5vw,2.4rem);font-weight:600;letter-spacing:.05em;color:var(--dark);line-height:1}
.search-header__amp{font-style:italic;font-weight:300;color:var(--rose)}
.divider{display:flex;align-items:center;gap:12px;margin:16px auto;width:fit-content}
.divider__line{width:48px;height:1px;background:linear-gradient(to right,transparent,var(--rose-light))}
.divider__line--r{background:linear-gradient(to left,transparent,var(--rose-light))}
.divider__diamond{width:5px;height:5px;background:var(--rose);transform:rotate(45deg)}
.search-header__date{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--rose)}
.card{background:white;border:1px solid rgba(197,116,138,.2);border-radius:2px;padding:32px 28px;max-width:380px;width:100%;text-align:center;box-shadow:0 8px 40px rgba(197,116,138,.08);position:relative}
.card::before{content:'';position:absolute;inset:5px;border:1px solid rgba(197,116,138,.1);border-radius:1px;pointer-events:none}
.card__label{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);margin-bottom:20px}
.search-input{width:100%;padding:13px 18px;border:1px solid rgba(197,116,138,.3);border-radius:1px;background:var(--rose-pale);font-family:'Cormorant Garamond',serif;font-size:1.25rem;font-style:italic;color:var(--dark);text-align:center;outline:none;transition:border-color .3s;margin-bottom:12px;display:block}
.search-input::placeholder{color:rgba(197,116,138,.5)}
.search-input:focus{border-color:var(--rose);box-shadow:0 0 0 3px rgba(197,116,138,.1)}
.search-btn{width:100%;padding:12px 24px;background:var(--rose);color:white;border:none;border-radius:1px;font-family:'Jost',sans-serif;font-size:10px;font-weight:400;letter-spacing:.3em;text-transform:uppercase;cursor:pointer;-webkit-appearance:none}
.result{margin-top:24px;display:none}
.result.show{display:block}
.result__table-label{font-size:10px;letter-spacing:.35em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}
.result__table-num{font-family:'Cormorant Garamond',serif;font-size:3.5rem;font-weight:600;color:var(--rose);line-height:1;margin-bottom:2px}
.result__guest{font-family:'Cormorant Garamond',serif;font-size:1.5rem;font-weight:600;color:var(--dark);margin-bottom:6px}
.result__note{font-size:12px;color:var(--rose)}
.badge{display:inline-block;background:var(--rose-pale);color:var(--rose);font-size:10px;padding:4px 12px;border:1px solid rgba(197,116,138,.3);margin-top:10px}
.notfound{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1rem;color:#999}
@media(max-width:640px){.search-layout{flex-direction:column}.search-photo{flex:0 0 260px;height:260px;width:100%}.search-photo__overlay{background:linear-gradient(to bottom,transparent 50%,var(--cream) 100%)}.search-content{padding:32px 20px 48px}}
@keyframes pulse{0%,100%{opacity:1;transform:translateY(0)}50%{opacity:.6;transform:translateY(5px)}}
</style>
</head>

function norm(s){return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim()}

function chercher(){
  var q=norm(document.getElementById("prenomInput").value.trim());
  if(!q)return;
  var res=document.getElementById("result");
  var found=null,name="";
  outer:for(var i=0;i<tables.length;i++){
    for(var j=0;j<tables[i].g.length;j++){
      var g=tables[i].g[j],ng=norm(g);
      var parts=ng.split(/[\s\/]+/);
      if(ng.indexOf(q)!==-1||parts.some(function(p){return p===q})){found=tables[i];name=g;break outer}
    }
  }
  res.className="result show";
  if(found){
    var badge=found.child?'<div class="badge">&#x1FA91; Une place aussi à la Table Enfants (Mezzanine)</div>':"";
    var enfant=found.num==="Enfants"?'<div class="badge">&#x1FA91; Table Enfants — Mezzanine</div>':"";
    res.innerHTML='<div class="divider"><div class="divider__line"></div><div class="divider__diamond"></div><div class="divider__line divider__line--r"></div></div><p class="result__table-label">Votre table</p><div class="result__table-num">'+found.num+'</div><div class="result__guest">'+name+'</div><p class="result__note">Bienvenue ! &#x1F338;</p>'+badge+enfant;
  }else{
    res.innerHTML='<p class="notfound">Prénom non trouvé…<br>Essayez tel qu\'il figure sur votre invitation.</p>';
  }
}

document.getElementById("page1").addEventListener("click",function(){
  document.getElementById("page1").classList.add("hidden");
  document.getElementById("page2").classList.remove("hidden");
});
document.getElementById("searchBtn").addEventListener("click",chercher);
document.getElementById("prenomInput").addEventListener("keydown",function(e){if(e.key==="Enter")chercher()});
